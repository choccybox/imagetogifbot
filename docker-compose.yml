name: giffy

services:
  bot:
    build: .
    env_file:
      - .env
    network_mode: bridge
    user: "0:0"
    ports:
      - "6769:6769"
    restart: unless-stopped
    volumes:
      - ./temp:/app/temp
      - ./gifs:/app/gifs

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bot
    restart: unless-stopped
